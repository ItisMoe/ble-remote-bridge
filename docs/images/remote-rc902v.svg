<text x="430" y="120" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">Legend</text>
<rect x="430" y="136" width="26" height="20" rx="5" fill="#2e8b57"/>
<text x="468" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933">TV and Chromecast</text>
<text x="468" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">D-pad and OK reach both devices</text>
<rect x="430" y="188" width="26" height="20" rx="5" fill="#2b6cb0"/>
<text x="468" y="202" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933">Chromecast only</text>
<text x="468" y="220" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">Back and Home - the TV stays on its HDMI input</text>
<rect x="430" y="240" width="26" height="20" rx="5" fill="#b85c00"/>
<text x="468" y="254" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933">TV only</text>
<text x="468" y="272" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">Volume, Mute, Ch±, mic and the TCL-specific keys</text>
<rect x="430" y="292" width="26" height="20" rx="5" fill="#8a8f98"/>
<text x="468" y="306" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2933">IR only</text>
<text x="468" y="324" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d">Power - never reaches the bridge</text>
<text x="430" y="372" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2933">Notes</text>
<text x="430" y="398" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933">Power</text>
<text x="482" y="398" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">The remote sends Power as an infrared signal,</text>
<text x="482" y="415" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">not over Bluetooth, so the bridge never sees it.</text>
<text x="430" y="440" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933">#n</text>
<text x="482" y="440" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">TCL-specific keys. n is the position in the</text>
<text x="482" y="457" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">capture order (top-left to bottom-right).</text>
<text x="482" y="482" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">Their function depends on the TV model; press a</text>
<text x="482" y="499" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">key and the Serial Monitor prints its code.</text>
<text x="430" y="524" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f2933">Input</text>
<text x="482" y="524" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">The Input key is one of the TCL keys. Assign it</text>
<text x="482" y="541" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">with  inputkey 0x....  (see the README).</text>
<text x="482" y="566" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">Any TCL key can also become the TV/Chromecast</text>
<text x="482" y="583" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52606d">switch with  switchkey 0x....  (see the README).</text>
<rect x="191" y="122" width="68" height="36" rx="18" fill="#8a8f98" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="225" y="145" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Power</text>
